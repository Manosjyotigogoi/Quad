# QD-020 — CI/CD pipeline.
#
# On every push: lint → test → build.
# On push to main: also deploy to staging.
# On tag (v*.*.*): promote staging → production.
#
# Required repo secrets:
#  - STAGING_SSH_KEY (private key for SSH deploy)
#  - STAGING_HOST
#  - STAGING_USER
#  - PROD_SSH_KEY / PROD_HOST / PROD_USER (for the tag-triggered deploy)
#  - DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (to push the image)
#  - SLACK_WEBHOOK (for deploy notifications)
#
# NOTE (fix, 2026-08-29):
#  - backend keeps cloudinary@^2.x. multer-storage-cloudinary@^4.0.0 only
#    declares a peer dep on cloudinary@^1.x, so the backend `npm ci` step
#    below uses --legacy-peer-deps to skip that peer-dependency check.
#    Since multer-storage-cloudinary isn't verified against the v2 SDK,
#    test any Cloudinary upload flows carefully — if uploads break, the
#    fix is to replace multer-storage-cloudinary with a small custom
#    multer storage engine built on cloudinary.v2.uploader.upload_stream.
#  - test-backend and test-frontend-a11y bumped to Node 22 (chromedriver@152
#    requires it).
#  - test-frontend-a11y now runs `browser-driver-manager install chrome`
#    before axe, and passes --chromedriver-path explicitly, so ChromeDriver
#    stays in sync with whatever Chrome ships on the runner.

name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  # ---- Lint -----------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Lint backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npx eslint . --ext .js || true  # QD-023 (a11y) etc — non-blocking
      - name: Lint frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint || true

  # ---- Test (backend) -------------------------------------------------------
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: |
          # --legacy-peer-deps: multer-storage-cloudinary@^4.0.0 peer-deps on
          # cloudinary@^1.x but we're intentionally on cloudinary@^2.x.
          npm ci --no-audit --no-fund --legacy-peer-deps
          # QD-001 guard — fails the build if any model fails to compile.
          npm run models:compile
          # Full test suite (QD-001 regression guard, QD-002/007 XSS,
          # QD-003 ReDoS, QD-004 tokenVersion, QD-005/006 order stock,
          # QD-018 /ready, QD-011 ObjectId guards).
          npm test
      - name: Boot check
        working-directory: backend
        run: npm run boot-check

  # ---- Test (frontend) ------------------------------------------------------
  # QD-023 — runs axe-core accessibility checks against a built frontend.
  test-frontend-a11y:
    name: Frontend build + axe-core accessibility gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Run axe-core against built pages
        working-directory: frontend
        run: |
          # Install axe-core + a static-server, then walk the built pages.
          # This is a minimal a11y gate — full e2e a11y testing would
          # use Playwright + axe but that's beyond the scope of this fix.
          npm install --no-save @axe-core/cli http-server
          npx browser-driver-manager install chrome
          npx http-server dist -p 4173 &
          SERVER_PID=$!
          sleep 2
          npx axe http://localhost:4173 --exit \
            --chromedriver-path "$(npx browser-driver-manager which chromedriver)"
          kill $SERVER_PID

  # ---- Build the Docker image ----------------------------------------------
  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend-a11y]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build + push (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            quad/marketplace:latest
            quad/marketplace:${{ github.ref_name }}
      - name: Build + push (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            quad/marketplace:staging
            quad/marketplace:sha-${{ github.sha }}

  # ---- Deploy to staging ---------------------------------------------------
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main'
    steps:
      - name: SSH + pull + restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/quad
            docker compose pull
            docker compose up -d --no-deps
            # Wait for /ready to flip back to 200.
            for i in {1..30}; do
              curl -fsS http://localhost:5000/api/ready && break
              sleep 2
            done

  # ---- Promote to production (on tag) -------------------------------------
  deploy-production:
    name: Promote to production
    runs-on: ubuntu-latest
    needs: build-image
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: SSH + pull + restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/quad
            docker compose pull
            docker compose up -d --no-deps
            for i in {1..30}; do
              curl -fsS http://localhost:5000/api/ready && break
              sleep 2
            done

  # ---- Load test (k6) -----------------------------------------------------
  # THIRD-PASS HARDENING — runs a k6 load test against the staging
  # deployment. Fails the workflow if SLO thresholds (p95 < 500ms,
  # error rate < 1%) are not met. This is the difference between
  # "tested at unit level" and "tested at production scale."
  load-test:
    name: k6 load test (staging)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/k6-action@v0.3.1
        with:
          filename: scripts/load-test.js
          flags: --vus 50 --duration 60s
        env:
          BASE_URL: https://staging.your-domain
          METRICS_TOKEN: ${{ secrets.STAGING_METRICS_TOKEN }}
